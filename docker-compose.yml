
services:
  app:
    build: .
    container_name: event-registration-app
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    volumes:
      - event_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  selenium:
    image: selenium/standalone-chromium:latest
    container_name: event-selenium
    profiles:
      - test
    ports:
      - "4444:4444"
    shm_size: 2gb
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4444/status', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  e2e:
    image: node:22-bookworm-slim
    profiles:
      - test
    working_dir: /app
    volumes:
      - .:/app
    environment:
      BASE_URL: 'http://app:3000'
      SELENIUM_URL: 'http://selenium:4444'
    command: sh -c "npm install && npm run test:e2e"
    depends_on:
      app:
        condition: service_healthy
      selenium:
        condition: service_healthy

volumes:
  event_data:
